<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Create your account
                        </h2>

                        <p class="text-muted">
                            Join the ReCampus student marketplace
                        </p>

                    </div>

                    <div id="alert"></div>

                    <form id="registerForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                College ID
                            </label>

                            <input
                                type="number"
                                id="college_id"
                                class="form-control"
                                placeholder="Example: 1"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Account Type
                            </label>

                            <select id="role" class="form-select">

                                <option value="buyer">
                                    Buyer / Student
                                </option>

                                <option value="student_seller">
                                    Student Seller
                                </option>

                                <option value="business_seller">
                                    Business Seller
                                </option>

                            </select>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100 btn-lg"
                        >
                            Create Account
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Already have an account?
                        </span>

                        <a href="login.html">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="config.js"></script>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const alertBox =
            document.getElementById("alert");

        alertBox.innerHTML = "";

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const college_id =
            Number(document.getElementById("college_id").value);

        const role =
            document.getElementById("role").value;


        try {

            const response = await fetch(
                `${API_URL}/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        college_id,
                        role
                    })
                }
            );

            const data = await response.json();

            if (!data.success) {

                alertBox.innerHTML = `
                    <div class="alert alert-danger">
                        ${data.message}
                    </div>
                `;

                return;
            }


            // SAVE LOGIN SESSION
            localStorage.setItem(
                "recampus_token",
                data.token
            );

            localStorage.setItem(
                "recampus_user",
                JSON.stringify(data.user)
            );


            alertBox.innerHTML = `
                <div class="alert alert-success">
                    Registration successful!
                    Redirecting...
                </div>
            `;


            setTimeout(() => {

                window.location.href = "index.html";

            }, 800);


        } catch (error) {

            console.error(error);

            alertBox.innerHTML = `
                <div class="alert alert-danger">
                    Unable to connect to server.
                </div>
            `;

        }

    });

</script>

</body>
</html>
