<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Seller Profile - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            <i class="bi bi-shop"></i>
            ReCampus
        </a>

        <div class="ms-auto d-flex gap-2">

            <a
                href="index.html"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-house"></i>
                Home
            </a>

            <a
                href="wishlist.html"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-heart"></i>
                Wishlist
            </a>

            <a
                href="cart.html"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-cart3"></i>
                Cart
            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    <!-- Loading -->
    <div
        id="loading"
        class="text-center py-5"
    >

        <div
            class="spinner-border text-primary"
            role="status"
        ></div>

        <p class="mt-3 text-muted">
            Loading seller profile...
        </p>

    </div>


    <!-- Error -->
    <div
        id="errorState"
        class="alert alert-danger d-none"
    >
        Unable to load seller profile.
    </div>


    <!-- Seller Profile -->
    <div
        id="sellerContent"
        class="d-none"
    >

        <!-- Profile Header -->
        <div class="card shadow-sm mb-4">

            <div class="card-body p-4">

                <div
                    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center"
                >

                    <div class="d-flex align-items-center">

                        <div
                            class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3"
                            style="
                                width:80px;
                                height:80px;
                                font-size:32px;
                            "
                        >
                            <i class="bi bi-person"></i>
                        </div>

                        <div>

                            <h2
                                id="sellerName"
                                class="fw-bold mb-1"
                            ></h2>

                            <div
                                id="verificationBadge"
                            ></div>

                            <p
                                id="sellerCollege"
                                class="text-muted mb-1"
                            ></p>

                            <small
                                id="sellerRole"
                                class="text-muted"
                            ></small>

                        </div>

                    </div>

                    <div class="mt-3 mt-md-0">

                        <span
                            id="memberSince"
                            class="text-muted"
                        ></span>

                    </div>

                </div>

            </div>

        </div>


        <!-- Statistics -->
        <div class="row g-3 mb-4">

            <div class="col-4">

                <div class="card text-center h-100 shadow-sm">

                    <div class="card-body">

                        <i
                            class="bi bi-box-seam fs-3 text-primary"
                        ></i>

                        <h4
                            id="productsListed"
                            class="fw-bold mt-2"
                        >
                            0
                        </h4>

                        <small class="text-muted">
                            Products Listed
                        </small>

                    </div>

                </div>

            </div>


            <div class="col-4">

                <div class="card text-center h-100 shadow-sm">

                    <div class="card-body">

                        <i
                            class="bi bi-bag-check fs-3 text-success"
                        ></i>

                        <h4
                            id="productsSold"
                            class="fw-bold mt-2"
                        >
                            0
                        </h4>

                        <small class="text-muted">
                            Products Sold
                        </small>

                    </div>

                </div>

            </div>


            <div class="col-4">

                <div class="card text-center h-100 shadow-sm">

                    <div class="card-body">

                        <i
                            class="bi bi-shop-window fs-3 text-warning"
                        ></i>

                        <h4
                            id="activeProducts"
                            class="fw-bold mt-2"
                        >
                            0
                        </h4>

                        <small class="text-muted">
                            Active Products
                        </small>

                    </div>

                </div>

            </div>

        </div>


        <!-- Products -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3 class="fw-bold mb-0">
                Seller's Products
            </h3>

        </div>


        <div
            id="productsContainer"
            class="row g-4"
        ></div>


        <div
            id="noProducts"
            class="text-center py-5 d-none"
        >

            <i
                class="bi bi-box-seam display-4 text-muted"
            ></i>

            <p class="text-muted mt-3">
                This seller has no active products.
            </p>

        </div>

    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000/api";


// Get seller ID from URL
const params =
    new URLSearchParams(
        window.location.search
    );

const sellerId =
    params.get("id");


// Load seller
async function loadSeller() {

    if (!sellerId) {

        showError();

        return;
    }

    try {

        const response =
            await fetch(
                `${API_URL}/sellers/${sellerId}`
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load seller"
            );
        }

        displaySeller(
            data.seller
        );

    } catch (error) {

        console.error(
            "Seller page error:",
            error
        );

        showError();

    }

}


// Display seller
function displaySeller(seller) {

    document
        .getElementById("loading")
        .classList.add("d-none");

    document
        .getElementById("sellerContent")
        .classList.remove("d-none");


    document.getElementById(
        "sellerName"
    ).textContent =
        seller.name || "Seller";


    document.getElementById(
        "sellerCollege"
    ).textContent =
        seller.college?.name
            ? `${seller.college.name}${
                seller.college.city
                    ? " • " + seller.college.city
                    : ""
              }`
            : "College not specified";


    document.getElementById(
        "sellerRole"
    ).textContent =
        formatRole(
            seller.role
        );


    document.getElementById(
        "memberSince"
    ).innerHTML = `
        <i class="bi bi-calendar3"></i>
        Member since
        ${formatDate(seller.created_at)}
    `;


    document.getElementById(
        "verificationBadge"
    ).innerHTML =
        seller.is_verified
            ? `
                <span class="badge bg-success">
                    <i class="bi bi-patch-check-fill"></i>
                    Verified Seller
                </span>
              `
            : `
                <span class="badge bg-secondary">
                    Seller
                </span>
              `;


    document.getElementById(
        "productsListed"
    ).textContent =
        seller.statistics.products_listed;


    document.getElementById(
        "productsSold"
    ).textContent =
        seller.statistics.products_sold;


    document.getElementById(
        "activeProducts"
    ).textContent =
        seller.statistics.active_products;


    displayProducts(
        seller.products || []
    );

}


// Display products
function displayProducts(products) {

    const container =
        document.getElementById(
            "productsContainer"
        );

    const activeProducts =
        products.filter(
            product =>
                product.status === "active"
        );


    if (activeProducts.length === 0) {

        document
            .getElementById("noProducts")
            .classList.remove("d-none");

        return;
    }


    container.innerHTML =
        activeProducts.map(
            product => {

                const image =
                    product.product_images?.find(
                        img =>
                            img.is_primary
                    )?.image_url ||
                    product.product_images?.[0]
                        ?.image_url ||
                    "https://placehold.co/600x400?text=ReCampus";


                return `
                    <div class="col-md-6 col-lg-4">

                        <div class="card h-100 shadow-sm">

                            <img
                                src="${image}"
                                class="card-img-top"
                                style="
                                    height:220px;
                                    object-fit:cover;
                                "
                                alt="${escapeHtml(
                                    product.title
                                )}"
                            >

                            <div class="card-body d-flex flex-column">

                                <span
                                    class="badge bg-secondary align-self-start mb-2"
                                >
                                    ${escapeHtml(
                                        product.category ||
                                        "Other"
                                    )}
                                </span>

                                <h5 class="card-title">
                                    ${escapeHtml(
                                        product.title
                                    )}
                                </h5>

                                <p class="text-muted small">
                                    Condition:
                                    ${escapeHtml(
                                        product.condition ||
                                        "Not specified"
                                    )}
                                </p>

                                <h5 class="text-primary fw-bold">
                                    ₹${Number(
                                        product.price
                                    ).toLocaleString("en-IN")}
                                </h5>

                                <a
                                    href="product.html?id=${product.id}"
                                    class="btn btn-primary mt-auto"
                                >
                                    View Product
                                </a>

                            </div>

                        </div>

                    </div>
                `;

            }
        ).join("");

}


// Format role
function formatRole(role) {

    if (!role) {
        return "Seller";
    }

    return role
        .replace(/_/g, " ")
        .replace(/\b\w/g, char =>
            char.toUpperCase()
        );
}


// Format date
function formatDate(date) {

    if (!date) {
        return "—";
    }

    return new Date(date)
        .toLocaleDateString(
            "en-IN",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
}


// Escape HTML
function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Error state
function showError() {

    document
        .getElementById("loading")
        .classList.add("d-none");

    document
        .getElementById("errorState")
        .classList.remove("d-none");

}


// Start
loadSeller();

</script>

</body>

</html>
