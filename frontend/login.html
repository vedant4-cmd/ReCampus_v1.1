<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="index.html"
        >
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>

    </div>
</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Welcome Back
                        </h2>

                        <p class="text-muted">
                            Login to your ReCampus account
                        </p>

                    </div>


                    <div id="alert"></div>


                    <form id="loginForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            <i class="bi bi-box-arrow-in-right"></i>
                            Login
                        </button>

                    </form>


                    <!-- DEMO LOGIN BUTTONS -->

                    <div class="mt-4">

                        <div class="text-center mb-3">
                            <small class="text-muted fw-semibold">
                                DEMO LOGIN
                            </small>
                        </div>


                        <div class="row g-2">

                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-primary w-100"
                                    onclick="demoLogin('buyer')"
                                >
                                    <i class="bi bi-person"></i>
                                    Buyer
                                </button>

                            </div>


                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-success w-100"
                                    onclick="demoLogin('student_seller')"
                                >
                                    <i class="bi bi-mortarboard"></i>
                                    Student Seller
                                </button>

                            </div>


                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-warning w-100"
                                    onclick="demoLogin('business_seller')"
                                >
                                    <i class="bi bi-shop"></i>
                                    Business Seller
                                </button>

                            </div>


                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-danger w-100"
                                    onclick="demoLogin('admin')"
                                >
                                    <i class="bi bi-shield-lock"></i>
                                    Admin
                                </button>

                            </div>

                        </div>

                    </div>


                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a href="register.html">
                            Create one
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:5000/api";


/*
    DEMO ACCOUNTS

    Create these four accounts in your ReCampus database first.

    IMPORTANT:
    Use demo-only passwords here, not your personal passwords.
*/

const DEMO_ACCOUNTS = {

    buyer: {
        email: "buyer1@gmail.com",
        password: "123456"
    },

    student_seller: {
        email: "seller2@gmail.com",
        password: "123456"
    },

    business_seller: {
        email: "seller3@gmail.com",
        password: "123456"
    },

    admin: {
        email: "seller1@gmail.com",
        password: "seller1"
    }

};


/*
    DEMO LOGIN
*/

function demoLogin(role) {

    const account = DEMO_ACCOUNTS[role];

    if (!account) {
        return;
    }

    document.getElementById("email").value =
        account.email;

    document.getElementById("password").value =
        account.password;

    // Automatically submit login
    document
        .getElementById("loginForm")
        .requestSubmit();

}


/*
    NORMAL LOGIN
*/

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const alertBox =
            document.getElementById("alert");

        alertBox.innerHTML = "";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try {

            const response = await fetch(
                `${API_URL}/auth/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );


            const data =
                await response.json();


            if (!data.success) {

                alertBox.innerHTML = `
                    <div class="alert alert-danger">
                        ${data.message}
                    </div>
                `;

                return;
            }


            // SAVE AUTHENTICATION

            localStorage.setItem(
                "recampus_token",
                data.token
            );

            localStorage.setItem(
                "recampus_user",
                JSON.stringify(data.user)
            );


            alertBox.innerHTML = `
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i>
                    Login successful!
                    Redirecting...
                </div>
            `;


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);


        } catch (error) {

            console.error(error);

            alertBox.innerHTML = `
                <div class="alert alert-danger">
                    Unable to connect to server.
                </div>
            `;

        }

    });

</script>

</body>
</html>
