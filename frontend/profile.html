<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand text-primary fw-bold"
            href="index.html"
        >
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>


        <div class="d-flex gap-2">

            <a
                href="index.html"
                class="btn btn-outline-primary"
            >
                <i class="bi bi-house"></i>
                Marketplace
            </a>

            <button
                class="btn btn-outline-danger"
                onclick="logout()"
            >
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>

        </div>

    </div>

</nav>



<main class="container py-5">

    <div
        id="profileContainer"
        class="row justify-content-center"
    >

        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div
                            class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                            style="width:90px;height:90px;font-size:40px;"
                        >
                            <i class="bi bi-person"></i>
                        </div>

                        <h2
                            id="profileName"
                            class="fw-bold mt-3 mb-1"
                        >
                            Loading...
                        </h2>

                        <p
                            id="profileRole"
                            class="text-muted mb-0"
                        >
                        </p>

                    </div>


                    <hr>


                    <div class="mb-3">

                        <label class="fw-semibold">
                            <i class="bi bi-person"></i>
                            Name
                        </label>

                        <div
                            id="name"
                            class="form-control bg-light mt-1"
                        >
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-semibold">
                            <i class="bi bi-envelope"></i>
                            Email
                        </label>

                        <div
                            id="email"
                            class="form-control bg-light mt-1"
                        >
                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="fw-semibold">
                            <i class="bi bi-person-badge"></i>
                            Account Type
                        </label>

                        <div
                            id="role"
                            class="form-control bg-light mt-1"
                        >
                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="fw-semibold">
                            <i class="bi bi-building"></i>
                            College ID
                        </label>

                        <div
                            id="college"
                            class="form-control bg-light mt-1"
                        >
                        </div>

                    </div>


                    <div class="d-grid gap-2">

                        <a
                            href="my-orders.html"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-box-seam"></i>
                            My Orders
                        </a>

                        <a
                            href="support.html"
                            class="btn btn-outline-primary"
                        >
                            <i class="bi bi-headset"></i>
                            Support
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>



<script>

const token =
    localStorage.getItem("recampus_token");

const userData =
    localStorage.getItem("recampus_user");


if (!token || !userData) {

    alert("Please login to view your profile.");

    window.location.href = "login.html";

} else {

    try {

        const user =
            JSON.parse(userData);


        document.getElementById("profileName").textContent =
            user.name || "User";


        document.getElementById("profileRole").textContent =
            formatRole(user.role);


        document.getElementById("name").textContent =
            user.name || "Not available";


        document.getElementById("email").textContent =
            user.email || "Not available";


        document.getElementById("role").textContent =
            formatRole(user.role);


        document.getElementById("college").textContent =
            user.college_id || "Not available";


    } catch (error) {

        console.error("Profile error:", error);

        localStorage.removeItem("recampus_token");
        localStorage.removeItem("recampus_user");

        window.location.href = "login.html";

    }

}


function formatRole(role) {

    if (!role) {
        return "Buyer";
    }

    return role
        .split("_")
        .map(word =>
            word.charAt(0).toUpperCase() + word.slice(1)
        )
        .join(" ");

}


function logout() {

    localStorage.removeItem("recampus_token");
    localStorage.removeItem("recampus_user");

    window.location.href = "index.html";

}

</script>


</body>
</html>
