<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container">

        <a
            class="navbar-brand text-primary fw-bold"
            href="index.html"
        >
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>

        <a
            href="index.html"
            class="btn btn-outline-primary"
        >
            <i class="bi bi-arrow-left"></i>
            Continue Shopping
        </a>

    </div>
</nav>


<div class="container py-5">

    <h2 class="fw-bold mb-4">
        <i class="bi bi-cart3"></i>
        Your Cart
    </h2>


    <div id="cartContainer"></div>

</div>


<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("recampus_cart") || "[]"
    );

}


function saveCart(cart) {

    localStorage.setItem(
        "recampus_cart",
        JSON.stringify(cart)
    );

}


function renderCart() {

    const cart = getCart();

    const container =
        document.getElementById("cartContainer");


    if (cart.length === 0) {

        container.innerHTML = `
            <div class="card border-0 shadow-sm">

                <div class="card-body text-center py-5">

                    <i
                        class="bi bi-cart-x display-3 text-muted"
                    ></i>

                    <h4 class="mt-3">
                        Your cart is empty
                    </h4>

                    <p class="text-muted">
                        Browse products and add something to your cart.
                    </p>

                    <a
                        href="index.html"
                        class="btn btn-primary"
                    >
                        Browse Products
                    </a>

                </div>

            </div>
        `;

        return;

    }


    let subtotal = 0;


    let itemsHTML = "";


    cart.forEach((item, index) => {

        const itemTotal =
            Number(item.price) * Number(item.quantity);

        subtotal += itemTotal;


        itemsHTML += `
            <div class="card border-0 shadow-sm mb-3">

                <div class="card-body">

                    <div class="row align-items-center">

                        <div class="col-md-2 mb-3 mb-md-0">

                            <img
                                src="${item.image}"
                                class="img-fluid rounded"
                                style="height:100px;width:100%;object-fit:cover;"
                            >

                        </div>


                        <div class="col-md-4">

                            <h5 class="mb-1">
                                ${item.title}
                            </h5>

                            <small class="text-muted">
                                ${item.category}
                            </small>

                            <div class="fw-bold text-primary mt-2">
                                ₹${Number(item.price).toLocaleString("en-IN")}
                            </div>

                        </div>


                        <div class="col-md-3">

                            <label class="form-label small">
                                Quantity
                            </label>

                            <div class="input-group">

                                <button
                                    class="btn btn-outline-secondary"
                                    onclick="changeQuantity(${index}, -1)"
                                >
                                    −
                                </button>

                                <input
                                    class="form-control text-center"
                                    value="${item.quantity}"
                                    readonly
                                >

                                <button
                                    class="btn btn-outline-secondary"
                                    onclick="changeQuantity(${index}, 1)"
                                >
                                    +
                                </button>

                            </div>

                        </div>


                        <div class="col-md-2 text-md-end mt-3 mt-md-0">

                            <div class="fw-bold">
                                ₹${itemTotal.toLocaleString("en-IN")}
                            </div>

                            <button
                                class="btn btn-sm btn-outline-danger mt-2"
                                onclick="removeItem(${index})"
                            >
                                <i class="bi bi-trash"></i>
                                Remove
                            </button>

                        </div>

                    </div>

                </div>

            </div>
        `;

    });


    container.innerHTML = `

        <div class="row">

            <div class="col-lg-8">

                ${itemsHTML}

            </div>


            <div class="col-lg-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <h5 class="fw-bold">
                            Order Summary
                        </h5>

                        <hr>

                        <div class="d-flex justify-content-between mb-2">

                            <span>
                                Subtotal
                            </span>

                            <span>
                                ₹${subtotal.toLocaleString("en-IN")}
                            </span>

                        </div>


                        <div class="d-flex justify-content-between mb-3">

                            <span>
                                Delivery
                            </span>

                            <span class="text-success">
                                Free
                            </span>

                        </div>


                        <hr>


                        <div class="d-flex justify-content-between fw-bold fs-5">

                            <span>
                                Total
                            </span>

                            <span class="text-primary">
                                ₹${subtotal.toLocaleString("en-IN")}
                            </span>

                        </div>


                        <button
                            class="btn btn-primary w-100 mt-4"
                            onclick="checkout()"
                        >
                            Proceed to Checkout
                            <i class="bi bi-arrow-right"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;

}


function changeQuantity(index, change) {

    const cart = getCart();

    cart[index].quantity += change;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    renderCart();

}


function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();

}


function checkout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    const token =
        localStorage.getItem("recampus_token");


    if (!token) {

        alert("Please login before checkout.");

        window.location.href = "login.html";

        return;

    }


    window.location.href = "checkout.html";

}


renderCart();

</script>

</body>
</html>
