<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            ReCampus
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarContent"
        >
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Browse
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="my-orders.html">
                        My Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="support.html">
                        Support
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="mb-4">
        <h2>
            <i class="bi bi-headset"></i>
            Customer Support
        </h2>

        <p class="text-muted">
            Need help with an order or product? Submit a support,
            refund, or replacement request.
        </p>
    </div>


    <!-- REQUEST FORM -->

    <div class="card shadow-sm mb-5">

        <div class="card-body p-4">

            <h4 class="mb-4">
                Submit a Request
            </h4>

            <form id="supportForm">

                <div class="mb-3">

                    <label class="form-label">
                        Request Type
                    </label>

                    <select
                        id="requestType"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select request type
                        </option>

                        <option value="support">
                            General Support
                        </option>

                        <option value="refund">
                            Refund Request
                        </option>

                        <option value="replacement">
                            Replacement Request
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Order
                    </label>

                    <select
                        id="orderId"
                        class="form-select"
                    >

                        <option value="">
                            Select an order
                        </option>

                    </select>

                    <small class="text-muted">
                        Select the order related to your request.
                    </small>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Product
                    </label>

                    <select
                        id="productId"
                        class="form-select"
                        disabled
                    >

                        <option value="">
                            Select an order first
                        </option>

                    </select>

                    <small class="text-muted">
                        Select the product related to your request.
                    </small>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Reason
                    </label>

                    <input
                        type="text"
                        id="reason"
                        class="form-control"
                        placeholder="Example: Product damaged"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="5"
                        placeholder="Explain your issue..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-send"></i>
                    Submit Request
                </button>

            </form>

            <div
                id="formMessage"
                class="mt-3"
            ></div>

        </div>

    </div>


    <!-- MY REQUESTS -->

    <div>

        <h4 class="mb-3">
            My Support Requests
        </h4>

        <div id="requestsContainer">

            <div class="text-muted">
                Loading requests...
            </div>

        </div>

    </div>

</div>


<script src="support.js"></script>

</body>
</html>
