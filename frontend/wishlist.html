<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-shop"></i>
            ReCampus
        </a>

        <div class="ms-auto d-flex gap-2">

            <a
                href="index.html"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-house"></i>
                Home
            </a>

            <a
                href="cart.html"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-cart3"></i>
                Cart
            </a>

        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="bi bi-heart-fill text-danger"></i>
                My Wishlist
            </h2>

            <p class="text-muted mb-0">
                Products you've saved for later
            </p>
        </div>

        <span
            id="wishlistCount"
            class="badge bg-primary"
        >
            0 items
        </span>

    </div>


    <div
        id="loading"
        class="text-center py-5"
    >
        <div
            class="spinner-border text-primary"
            role="status"
        ></div>

        <p class="mt-3 text-muted">
            Loading wishlist...
        </p>
    </div>


    <div
        id="wishlistContainer"
        class="row g-4"
    ></div>


    <div
        id="emptyState"
        class="text-center py-5 d-none"
    >

        <i
            class="bi bi-heart display-1 text-muted"
        ></i>

        <h4 class="mt-3">
            Your wishlist is empty
        </h4>

        <p class="text-muted">
            Save products you like and find them here later.
        </p>

        <a
            href="index.html"
            class="btn btn-primary"
        >
            Browse Products
        </a>

    </div>

</div>


<script>

const API_URL = "http://localhost:5000/api";

const token =
    localStorage.getItem("recampus_token");


// Check login
if (!token) {

    alert("Please login to view your wishlist.");

    window.location.href = "login.html";

}


// Load wishlist
async function loadWishlist() {

    try {

        const response = await fetch(
            `${API_URL}/wishlist`,
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load wishlist"
            );

        }

        document.getElementById("loading")
            .classList.add("d-none");

        document.getElementById("wishlistCount")
            .textContent =
            `${data.count} item${data.count === 1 ? "" : "s"}`;

        if (!data.wishlist || data.wishlist.length === 0) {

            document.getElementById("emptyState")
                .classList.remove("d-none");

            return;
        }

        displayWishlist(data.wishlist);

    } catch (error) {

        console.error(
            "Wishlist loading error:",
            error
        );

        document.getElementById("loading")
            .classList.add("d-none");

        document.getElementById("wishlistContainer")
            .innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        Unable to load wishlist.
                    </div>
                </div>
            `;
    }
}


// Display wishlist
function displayWishlist(items) {

    const container =
        document.getElementById(
            "wishlistContainer"
        );

    container.innerHTML = items.map(item => {

        const product = item.products;

        if (!product) {
            return "";
        }

        const image =
            product.product_images?.find(
                img => img.is_primary
            )?.image_url ||
            product.product_images?.[0]?.image_url ||
            "https://placehold.co/600x400?text=ReCampus";

        const stockText =
            product.stock > 0
                ? `${product.stock} available`
                : "Out of stock";

        const stockClass =
            product.stock > 0
                ? "text-success"
                : "text-danger";

        return `

            <div class="col-md-6 col-lg-4">

                <div class="card h-100 shadow-sm">

                    <img
                        src="${image}"
                        class="card-img-top"
                        style="height:220px; object-fit:cover;"
                        alt="${escapeHtml(product.title)}"
                    >

                    <div class="card-body d-flex flex-column">

                        <span class="badge bg-secondary align-self-start mb-2">
                            ${escapeHtml(product.category || "Other")}
                        </span>

                        <h5 class="card-title">
                            ${escapeHtml(product.title)}
                        </h5>

                        <p class="text-muted small mb-2">
                            ${escapeHtml(
                                product.colleges?.name ||
                                "College marketplace"
                            )}
                        </p>

                        <h5 class="text-primary fw-bold">
                            ₹${Number(product.price).toLocaleString("en-IN")}
                        </h5>

                        <p class="${stockClass} small">
                            <i class="bi bi-box-seam"></i>
                            ${stockText}
                        </p>

                        <div class="mt-auto d-flex gap-2">

                            <a
                                href="product.html?id=${product.id}"
                                class="btn btn-primary flex-grow-1"
                            >
                                View Product
                            </a>

                            <button
                                class="btn btn-outline-danger"
                                onclick="removeFromWishlist(${product.id})"
                                title="Remove from wishlist"
                            >
                                <i class="bi bi-trash"></i>
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        `;

    }).join("");
}


// Remove wishlist item
async function removeFromWishlist(productId) {

    try {

        const response = await fetch(
            `${API_URL}/wishlist/${productId}`,
            {
                method: "DELETE",
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Unable to remove item"
            );

            return;
        }

        await loadWishlist();

    } catch (error) {

        console.error(
            "Remove wishlist error:",
            error
        );

        alert(
            "Unable to connect to server."
        );
    }
}


// Prevent HTML injection
function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Start
loadWishlist();

</script>

</body>
</html>
