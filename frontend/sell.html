<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell Something - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container">

        <a
            class="navbar-brand text-primary fw-bold"
            href="index.html"
        >
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>

        <a
            href="index.html"
            class="btn btn-outline-primary"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Marketplace
        </a>

    </div>
</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-2">
                        Sell Something
                    </h2>

                    <p class="text-muted mb-4">
                        List your product on the ReCampus marketplace.
                    </p>


                    <div
                        id="message"
                        class="alert d-none"
                    ></div>


                    <form id="sellForm">

                        <!-- Product title -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Product Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="e.g. Engineering Mathematics Book"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Stationery">
                                    Stationery
                                </option>

                                <option value="Furniture">
                                    Furniture
                                </option>

                                <option value="Notes">
                                    Notes
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Price + Stock -->
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Price (₹)
                                </label>

                                <input
                                    type="number"
                                    id="price"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="500"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Stock
                                </label>

                                <input
                                    type="number"
                                    id="stock"
                                    class="form-control"
                                    min="1"
                                    value="1"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Condition -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Condition
                            </label>

                            <select
                                id="condition"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select condition
                                </option>

                                <option value="new">
                                    New
                                </option>

                                <option value="like_new">
                                    Like New
                                </option>

                                <option value="good">
                                    Good
                                </option>

                                <option value="fair">
                                    Fair
                                </option>

                                <option value="used">
                                    Used
                                </option>

                            </select>

                        </div>


                        <!-- College -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                College
                            </label>

                            <select
                                id="college_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select college
                                </option>

                                <option value="1">
                                    IIT Bombay
                                </option>

                                <option value="2">
                                    VJTI
                                </option>

                                <option value="3">
                                    University of Mumbai
                                </option>

                                <option value="4">
                                    BITS Pilani
                                </option>

                                <option value="5">
                                    MIT World Peace University
                                </option>

                            </select>

                        </div>


                        <!-- Description -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe the product..."
                                required
                            ></textarea>

                        </div>


                        <!-- Image -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Product Image
                            </label>

                            <input
                                type="file"
                                id="image"
                                class="form-control"
                                accept="image/*"
                                required
                            >

                            <div class="form-text">
                                Upload a clear image of your product. Maximum 5 MB.
                            </div>

                        </div>


                        <button
                            type="submit"
                            id="submitBtn"
                            class="btn btn-primary w-100 py-2"
                        >
                            <i class="bi bi-plus-circle"></i>
                            List Product
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="config.js"></script>

<script>

// Check login
const token = localStorage.getItem("recampus_token");

const userData = localStorage.getItem("recampus_user");


if (!token || !userData) {

    alert("Please login first.");

    window.location.href = "login.html";

}


// Check seller role
const user = JSON.parse(userData);


if (
    user.role !== "student_seller" &&
    user.role !== "business_seller"
) {
    alert("Only sellers can list products.");
    window.location.href = "index.html";
}

if (
    user.seller_verification_status !== "approved"
) {
    document.getElementById("sellForm").style.display = "none";

    document.getElementById("message").className =
        "alert alert-warning";

    document.getElementById("message").textContent =
        "Your seller account is awaiting verification. You can start selling once an admin approves your account.";

    throw new Error("Seller not verified");
}


const form = document.getElementById("sellForm");

const message = document.getElementById("message");

const submitBtn = document.getElementById("submitBtn");


function showMessage(text, type) {

    message.className = `alert alert-${type}`;

    message.textContent = text;

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    submitBtn.disabled = true;

    submitBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Creating product...
    `;


    try {

        const productData = {

            title:
                document.getElementById("title").value.trim(),

            description:
                document.getElementById("description").value.trim(),

            category:
                document.getElementById("category").value,

            price:
                Number(document.getElementById("price").value),

            condition:
                document.getElementById("condition").value,

            stock:
                Number(document.getElementById("stock").value),

            college_id:
                Number(document.getElementById("college_id").value),

            status: "active"

        };


        // Create product
        const productResponse = await fetch(
            `${API_URL}/products`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify(productData)
            }
        );


        const productResult =
            await productResponse.json();


        if (!productResponse.ok) {

            throw new Error(
                productResult.message ||
                "Failed to create product"
            );

        }


        const product =
            productResult.product;


        // Upload image
        const imageFile =
            document.getElementById("image").files[0];


        const formData = new FormData();

        formData.append("image", imageFile);

        formData.append(
            "product_id",
            product.id
        );

        formData.append(
            "is_primary",
            "true"
        );


        submitBtn.innerHTML = `
            <span class="spinner-border spinner-border-sm"></span>
            Uploading image...
        `;


        const imageResponse = await fetch(
            `${API_URL}/products/upload-image`,
            {
                method: "POST",

                headers: {
                    "Authorization":
                        `Bearer ${token}`
                },

                body: formData
            }
        );


        const imageResult =
            await imageResponse.json();


        if (!imageResponse.ok) {

            throw new Error(
                imageResult.message ||
                "Product created but image upload failed"
            );

        }


        showMessage(
            "Product listed successfully!",
            "success"
        );


        form.reset();


        setTimeout(() => {

            window.location.href =
                `product.html?id=${product.id}`;

        }, 1200);


    } catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "danger"
        );

    }


    submitBtn.disabled = false;

    submitBtn.innerHTML = `
        <i class="bi bi-plus-circle"></i>
        List Product
    `;

});

</script>

</body>
</html>
