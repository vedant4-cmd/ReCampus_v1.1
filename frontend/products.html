<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Products - ReCampus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .filter-card {
            border: none;
            border-radius: 12px;
        }

        .product-card {
            border: none;
            border-radius: 12px;
            height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f1f3f5;
            border-radius: 12px 12px 0 0;
        }

        .product-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0d6efd;
        }

        .empty-state {
            min-height: 300px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a
            class="navbar-brand text-primary"
            href="index.html"
        >
            <i class="bi bi-arrow-repeat"></i>
            ReCampus
        </a>

        <div class="ms-auto d-flex gap-2">

            <a
                href="index.html"
                class="btn btn-outline-primary"
            >
                <i class="bi bi-house"></i>
                Home
            </a>

            <a
                href="cart.html"
                class="btn btn-outline-primary"
            >
                <i class="bi bi-cart3"></i>
                Cart
            </a>

        </div>

    </div>
</nav>


<!-- MAIN -->
<main class="container py-4">

    <!-- HEADER -->
    <div class="mb-4">

        <h1 class="fw-bold">
            Browse Products
        </h1>

        <p class="text-muted mb-0">
            Find textbooks, electronics, notes and other products
            from your campus community.
        </p>

    </div>


    <!-- SEARCH -->
    <div class="card filter-card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-lg-7">

                    <label
                        for="searchInput"
                        class="form-label fw-semibold"
                    >
                        Search
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search products..."
                        >

                    </div>

                </div>


                <div class="col-lg-5">

                    <label
                        for="sortSelect"
                        class="form-label fw-semibold"
                    >
                        Sort By
                    </label>

                    <select
                        id="sortSelect"
                        class="form-select"
                    >
                        <option value="newest">
                            Newest
                        </option>

                        <option value="price_low">
                            Price: Low to High
                        </option>

                        <option value="price_high">
                            Price: High to Low
                        </option>

                        <option value="name">
                            Name
                        </option>
                    </select>

                </div>

            </div>

        </div>

    </div>


    <div class="row g-4">

        <!-- FILTERS -->
        <div class="col-lg-3">

            <div class="card filter-card shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-funnel"></i>
                            Filters
                        </h5>

                        <button
                            id="clearFilters"
                            class="btn btn-sm btn-link text-decoration-none"
                        >
                            Clear
                        </button>

                    </div>


                    <!-- CATEGORY -->

                    <div class="mb-4">

                        <label
                            for="categoryFilter"
                            class="form-label fw-semibold"
                        >
                            Category
                        </label>

                        <select
                            id="categoryFilter"
                            class="form-select"
                        >

                            <option value="">
                                All Categories
                            </option>

                            <option value="Books">
                                Books
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Notes">
                                Notes
                            </option>

                            <option value="Stationery">
                                Stationery
                            </option>

                            <option value="Clothing">
                                Clothing
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- CONDITION -->

                    <div class="mb-4">

                        <label
                            for="conditionFilter"
                            class="form-label fw-semibold"
                        >
                            Condition
                        </label>

                        <select
                            id="conditionFilter"
                            class="form-select"
                        >

                            <option value="">
                                All Conditions
                            </option>

                            <option value="new">
                                New
                            </option>

                            <option value="like_new">
                                Like New
                            </option>

                            <option value="good">
                                Good
                            </option>

                            <option value="fair">
                                Fair
                            </option>

                        </select>

                    </div>


                    <!-- PRICE -->

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Price Range
                        </label>

                        <div class="row g-2">

                            <div class="col-6">

                                <input
                                    type="number"
                                    id="minPrice"
                                    class="form-control"
                                    placeholder="Min ₹"
                                    min="0"
                                >

                            </div>

                            <div class="col-6">

                                <input
                                    type="number"
                                    id="maxPrice"
                                    class="form-control"
                                    placeholder="Max ₹"
                                    min="0"
                                >

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="col-lg-9">

            <div
                class="d-flex justify-content-between align-items-center mb-3"
            >

                <div>

                    <span
                        id="resultCount"
                        class="text-muted"
                    >
                        Loading products...
                    </span>

                </div>

            </div>


            <!-- LOADING -->

            <div
                id="loading"
                class="text-center py-5"
            >

                <div class="spinner-border text-primary"></div>

                <p class="mt-3 text-muted">
                    Loading products...
                </p>

            </div>


            <!-- PRODUCT GRID -->

            <div
                id="productGrid"
                class="row g-4"
            ></div>


            <!-- EMPTY -->

            <div
                id="emptyState"
                class="card border-0 shadow-sm d-none"
            >

                <div class="card-body empty-state d-flex flex-column justify-content-center align-items-center text-center">

                    <i class="bi bi-search fs-1 text-muted"></i>

                    <h4 class="mt-3">
                        No products found
                    </h4>

                    <p class="text-muted">
                        Try changing your search or filters.
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="clearFilters()"
                    >
                        Clear Filters
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<script>

const API_URL = "http://localhost:5000/api";

const urlParams = new URLSearchParams(window.location.search);
const initialSearch = urlParams.get("search");
const initialCategory = urlParams.get("category");

let allProducts = [];


// ELEMENTS

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const categoryFilter =
    document.getElementById("categoryFilter");

const conditionFilter =
    document.getElementById("conditionFilter");

const minPrice =
    document.getElementById("minPrice");

const maxPrice =
    document.getElementById("maxPrice");


// LOAD PRODUCTS

async function loadProducts() {

    try {

        const response =
            await fetch(
                `${API_URL}/products`
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load products"
            );

        }

        allProducts =
            data.products || [];

        document.getElementById(
            "loading"
        ).classList.add("d-none");

        applyFilters();

    } catch (error) {

        console.error(
            "Load products error:",
            error
        );

        document.getElementById(
            "loading"
        ).innerHTML = `
            <div class="alert alert-danger">
                Failed to load products.
                Please make sure the backend is running.
            </div>
        `;

    }

}


// APPLY FILTERS

function applyFilters() {

    let products =
        [...allProducts];


    // SEARCH

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    if (search) {

        products =
            products.filter(product => {

                return (
                    product.title
                        ?.toLowerCase()
                        .includes(search)

                    ||

                    product.description
                        ?.toLowerCase()
                        .includes(search)

                    ||

                    product.category
                        ?.toLowerCase()
                        .includes(search)
                );

            });

    }


    // CATEGORY

    const category =
        categoryFilter.value;

    if (category) {

        products =
            products.filter(
                product =>
                    product.category === category
            );

    }


    // CONDITION

    const condition =
        conditionFilter.value;

    if (condition) {

        products =
            products.filter(
                product =>
                    product.condition === condition
            );

    }


    // MIN PRICE

    const minimum =
        Number(minPrice.value);

    if (
        minPrice.value !== "" &&
        !Number.isNaN(minimum)
    ) {

        products =
            products.filter(
                product =>
                    Number(product.price) >= minimum
            );

    }


    // MAX PRICE

    const maximum =
        Number(maxPrice.value);

    if (
        maxPrice.value !== "" &&
        !Number.isNaN(maximum)
    ) {

        products =
            products.filter(
                product =>
                    Number(product.price) <= maximum
            );

    }


    // SORT

    switch (sortSelect.value) {

        case "price_low":

            products.sort(
                (a, b) =>
                    Number(a.price) -
                    Number(b.price)
            );

            break;


        case "price_high":

            products.sort(
                (a, b) =>
                    Number(b.price) -
                    Number(a.price)
            );

            break;


        case "name":

            products.sort(
                (a, b) =>
                    (a.title || "")
                        .localeCompare(
                            b.title || ""
                        )
            );

            break;


        case "newest":

        default:

            products.sort(
                (a, b) =>
                    new Date(b.created_at) -
                    new Date(a.created_at)
            );

            break;

    }


    displayProducts(products);

}


// DISPLAY PRODUCTS

function displayProducts(products) {

    const grid =
        document.getElementById(
            "productGrid"
        );

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    document.getElementById(
        "resultCount"
    ).textContent =
        `${products.length} product${
            products.length === 1 ? "" : "s"
        } found`;


    grid.innerHTML = "";


    if (!products.length) {

        emptyState.classList.remove(
            "d-none"
        );

        return;

    }


    emptyState.classList.add(
        "d-none"
    );


    products.forEach(product => {

        const primaryImage =
            product.product_images?.find(img => img.is_primary)?.image_url ||
            product.product_images?.[0]?.image_url ||
            "https://via.placeholder.com/300x200?text=No+Image";


        const card =
            document.createElement("div");

        card.className =
            "col-md-6 col-xl-4";


        card.innerHTML = `

            <div class="card product-card shadow-sm">

                <img
                    src="${escapeHtml(primaryImage)}"
                    class="product-image"
                    alt="${escapeHtml(product.title)}"
                >

                <div class="card-body d-flex flex-column">

                    <span class="badge bg-light text-primary align-self-start mb-2">
                        ${escapeHtml(
                            product.category ||
                            "Product"
                        )}
                    </span>

                    <h5 class="fw-bold product-title">
                        ${escapeHtml(
                            product.title
                        )}
                    </h5>

                    <div class="price mb-2">
                        ₹${Number(
                            product.price
                        ).toLocaleString("en-IN")}
                    </div>

                    <div class="mb-2">

                        <span class="badge bg-success">
                            ${escapeHtml(
                                product.condition ||
                                "Available"
                            )}
                        </span>

                    </div>

                    <p class="text-muted small mb-3">

                        ${
                            escapeHtml(
                                product.description ||
                                "No description available."
                            )
                        }

                    </p>

                    <div class="mt-auto d-grid">

                        <a
                            href="product.html?id=${encodeURIComponent(product.id)}"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-eye"></i>
                            View Product
                        </a>

                    </div>

                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


// CLEAR FILTERS

function clearFilters() {

    searchInput.value = "";

    categoryFilter.value = "";

    conditionFilter.value = "";

    minPrice.value = "";

    maxPrice.value = "";

    sortSelect.value = "newest";

    applyFilters();

}


// ESCAPE HTML

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// EVENTS

searchInput.addEventListener(
    "input",
    applyFilters
);

sortSelect.addEventListener(
    "change",
    applyFilters
);

categoryFilter.addEventListener(
    "change",
    applyFilters
);

conditionFilter.addEventListener(
    "change",
    applyFilters
);

minPrice.addEventListener(
    "input",
    applyFilters
);

maxPrice.addEventListener(
    "input",
    applyFilters
);

document.getElementById(
    "clearFilters"
).addEventListener(
    "click",
    clearFilters
);


// START

if (initialSearch) {
    document.getElementById("searchInput").value = initialSearch;
}

if (initialCategory) {
    document.getElementById("categoryFilter").value = initialCategory;
}

loadProducts();

</script>

</body>
</html>
